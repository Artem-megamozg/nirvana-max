services:
  nirvana-max:
    build: .
    container_name: nirvana-max
    restart: unless-stopped
    env_file: .env
    environment:
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./web:/app/web
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
