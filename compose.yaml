# ============================================================
# compose.yaml — запуск всего локального стека одной командой
# ============================================================
# Использование:
#   docker compose up --build
# ============================================================
services:
  nirvana-max:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nirvana-max
    restart: unless-stopped
    ports:
      # Наружу отдаём 8000; в проде Nginx проксирует на него
      - "8000:8000"
    env_file:
      # Секреты читаются из .env (не коммитится в Git)
      - .env
    healthcheck:
      # Проверка живости
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
